name: Refresh HouseLens market data and deploy
on:
  schedule:
    # Tuesdays and Fridays, 08:00 UTC (09:00 BST in summer).
    - cron: '0 8 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: house-lens-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source and saved history
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check JavaScript calculations
        run: node tests/test_calculations.js
      - name: Update from authoritative sources
        env:
          PROPERTYDATA_API_KEY: ${{ secrets.PROPERTYDATA_API_KEY }}
        run: python -m update.main
      - name: Commit new dated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh observed housing and rate snapshots'
            git push
          fi
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload installable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
