name: Refresh HouseLens market data and deploy
on:
  schedule:
    # Official economic data + CPI: automatically every six hours.
    - cron: '0 */6 * * *'
    # RealtyAPI listings: Tuesdays and Fridays only, to protect free credits.
    - cron: '0 8 * * 2,5'
  workflow_dispatch:
    inputs:
      refresh_listings:
        description: 'Include RealtyAPI property listings (uses API credits)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: house-lens-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source and saved history
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check JavaScript calculations
        run: |
          node tests/test_calculations.js
          node tests/test_listing_filters.js
      - name: Update from authoritative sources
        env:
          REALTYAPI_KEY: ${{ secrets.REALTYAPI_KEY }}
          HOUSELENS_REFRESH_LISTINGS: ${{ github.event.schedule == '0 8 * * 2,5' || (github.event_name == 'workflow_dispatch' && inputs.refresh_listings) }}
        run: python -m update.main
      - name: Commit new dated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh observed housing and rate snapshots'
            git push
          fi
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload installable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
